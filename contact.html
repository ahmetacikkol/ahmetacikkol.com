<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact — Ahmet Açıkkol</title>
<meta name="description" content="Get in touch with Ahmet Açıkkol, cinematographer based in Istanbul."/>
<style>
:root{--bg:#0a0a0b;--soft:#141416;--fg:#f4f2ee;--muted:#98958d;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
::selection{background:var(--fg);color:var(--bg)}

.nav{position:fixed;inset:0 0 auto 0;z-index:90;display:flex;justify-content:space-between;align-items:center;
padding:18px 4vw;background:linear-gradient(to bottom,rgba(10,10,11,.95),rgba(10,10,11,.75));
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:14px;font-weight:700;letter-spacing:.3em}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:color .25s}
.nav-links a:hover,.nav-links a.on{color:var(--fg)}
@media(max-width:760px){
  .brand{font-size:11px;letter-spacing:.2em}
  .nav-links{gap:16px}
  .nav-links a:nth-child(n+4){display:none}
}

main{flex:1;padding:190px 4vw 110px;max-width:1100px;margin:0 auto;width:100%}
.overline{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:44px}

.cols{display:grid;grid-template-columns:1.35fr .65fr;gap:clamp(34px,6vw,80px);align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}

.who{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.line-item{display:block;font-size:clamp(17px,2.1vw,25px);font-weight:500;letter-spacing:.005em;line-height:1.45;
width:max-content;max-width:100%;word-break:break-word;margin-bottom:10px;
background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .45s}
.line-item:hover{background-size:100% 1px}

.side .k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.side .v{font-size:15px;line-height:1.7;margin-bottom:30px}
.side .v a{color:var(--muted);transition:color .25s;display:block}
.side .v a:hover{color:var(--fg)}

footer{padding:32px 4vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>

  <div class="nav-links">

    <a href="https://instagram.com/ahmetacikkol" target="_blank" rel="noopener">Instagram</a>
  </div>
</nav>

<main>
  <div class="overline">Contact</div>

  <div class="cols">
    <div>
      <div class="who">Ahmet Açıkkol</div>
      <a class="line-item" href="mailto:ahmetacikkol@gmail.com">ahmetacikkol@gmail.com</a>
      <a class="line-item" href="tel:+905336579873">+90 533 657 98 73</a>
    </div>

    <aside class="side">
      <div class="k">Based in</div>
      <div class="v">Istanbul — Available Worldwide</div>
      <div class="k">Elsewhere</div>
      <div class="v">
        <a href="https://vimeo.com/ahmetacikkol" target="_blank" rel="noopener">Vimeo</a>
        <a href="https://instagram.com/ahmetacikkol" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.imdb.com/name/nm5241768/" target="_blank" rel="noopener">IMDb</a>
        <a href="https://www.linkedin.com/in/ahmetacikkol/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </aside>
  </div>
</main>

<footer>
  <span>© 2026 Ahmet Açıkkol</span>
  <span>Cinematographer · Director of Photography</span>
</footer>

</body>
</html>
