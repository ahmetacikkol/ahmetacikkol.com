<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahmet Açıkkol — Cinematographer</title>
<meta name="description" content="Ahmet Açıkkol — Istanbul-based cinematographer. TV series, commercials, Unreal Engine and music videos."/>
<style>
:root{--bg:#f4f2ec;--soft:#e7e3da;--fg:#17160f;--muted:#7b776c;--line:rgba(0,0,0,.11)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--fg);color:var(--bg)}

/* NAV */
.nav{position:fixed;inset:0 0 auto 0;z-index:90;display:flex;justify-content:space-between;align-items:center;
padding:18px 4vw;background:linear-gradient(to bottom,rgba(244,242,236,.94),rgba(244,242,236,.70));
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:14px;font-weight:700;letter-spacing:.3em}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:color .25s}
.nav-links a:hover{color:var(--fg)}
@media(max-width:760px){.brand{font-size:11px;letter-spacing:.2em}.nav-links{gap:16px}.nav-links a:nth-child(n+3){display:none}}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:104px 4vw 22px;max-width:1500px;margin:0 auto}
.fbtn{font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
background:transparent;border:1px solid var(--line);border-radius:30px;padding:9px 16px;cursor:pointer;transition:all .25s}
.fbtn:hover{color:var(--fg);border-color:rgba(0,0,0,.30)}
.fbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 4vw 70px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:3px;background:var(--soft);cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.28) contrast(1.02);
transform:scale(1.001);transition:filter .45s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover img{filter:grayscale(0);transform:scale(1.05)}
.card .meta{position:absolute;inset:auto 0 0 0;padding:30px 16px 14px;
background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));
display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.card:hover .meta{opacity:1;transform:none}
.card .t{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.card .r{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);white-space:nowrap}
@media(hover:none){.card .meta{opacity:1;transform:none}}
@media(max-width:760px){
  .card .meta{flex-direction:column;align-items:flex-start;gap:4px;padding:34px 14px 13px}
  .card .t{font-size:12px;letter-spacing:.06em}
  .card .r{white-space:normal;font-size:9px;letter-spacing:.12em;line-height:1.4}
}

/* ABOUT / CONTACT */
.sec{padding:90px 4vw;border-top:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto}
.overline{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
.lead{font-size:clamp(20px,2.4vw,30px);font-weight:300;line-height:1.4;max-width:840px}
.body{color:var(--muted);font-size:15px;line-height:1.7;max-width:680px;margin-top:20px}
.contact{text-align:center}
.mail{display:inline-block;font-size:clamp(24px,4.6vw,52px);font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin-top:6px;
background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .4s}
.mail:hover{background-size:100% 1px}
.socials{margin-top:34px;display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.socials a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:color .25s}
.socials a:hover{color:var(--fg)}
footer{padding:32px 4vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(244,242,236,.96);padding:18px}
.modal.on{display:flex}
.player{width:min(1150px,100%);aspect-ratio:16/9;position:relative}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:4px}
.close{position:absolute;top:16px;right:22px;font-size:26px;background:none;border:none;color:#17160f;cursor:pointer;opacity:.8}
.close:hover{opacity:1}

/* reveal */
.card{opacity:0;transform:translateY(16px)}
.card.in{opacity:1;transform:none;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
</style>
</head>
<body>

n Eve", "v": "1166409513", "img": "assets/img/portfolio/donmek-icin-eve.png", "r": "Cinematographer", "c": "Music Video"}, {"t": "Tolani - Cry Baby", "v": "1117944144", "img": "assets/img/portfolio/tolani-cry-baby.jpg", "r": "Cinematographer", "c": "Music Video"}, {"t": "Muhiddin Aslanbay", "v": "1117943293", "img": "assets/img/portfolio/muhiddin_aslanbey.jpg", "r": "Cinematographer", "c": "Music Video"}, {"t": "Jabbar", "v": "1117941747", "img": "assets/img/portfolio/jabbar.png", "r": "Cinematographer", "c": "Music Video"}];

const grid=document.getElementById('grid');
function render(cat){
  grid.innerHTML='';
  ITEMS.filter(i=>cat==='all'||i.c===cat).forEach(i=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<img loading="lazy" src="'+i.img+'" alt="'+i.t+'"/><div class="meta"><span class="t">'+i.t+'</span><span class="r">'+i.r+'</span></div>';
    d.addEventListener('click',()=>openModal(i.v));
    grid.appendChild(d);
  });
  observeAll();
}
const modal=document.getElementById('modal'),mframe=document.getElementById('mframe');
function openModal(id){mframe.src='https://player.vimeo.com/video/'+id+'?autoplay=1&title=0&byline=0&portrait=0';modal.classList.add('on');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('on');mframe.src='';document.body.style.overflow=''}
document.getElementById('mclose').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  render(b.dataset.cat);
}));
let io;
function observeAll(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}
render('all');
